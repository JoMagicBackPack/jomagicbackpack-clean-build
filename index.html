<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoMagicBackpack - Unique Finds & Reseller Treasures</title>
  <meta name="description" content="JoMagicBackpack - vintage, new, and unpredictable finds from the backpack.">
  <link rel="icon" href="AF33BEB9-4375-48AE-B35A-07DF95F39F98.png">
  <link rel="stylesheet" href="css/styles.css?v=20260529f">
  <style>
    .backpack-instruction {
      font-size: clamp(1.18rem, 3.8vw, 1.62rem);
      margin-bottom: 0;
    }

    .home-backpack-section {
      min-height: min(88vh, 860px);
      padding-top: 0.8rem;
      overflow: hidden;
    }

    .backpack-gate {
      display: grid;
      justify-items: center;
      position: relative;
    }

    .backpack-entrance {
      position: relative;
      display: grid;
      justify-items: center;
      width: min(94vw, 560px);
      margin: clamp(4rem, 8vh, 5.5rem) auto 0;
      padding-top: clamp(0.55rem, 1.3vw, 1rem);
      isolation: isolate;
    }

    .backpack-entrance::before {
      content: "";
      position: absolute;
      inset: -7% -16% -3%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 50% 36%, rgba(246,200,95,.16), rgba(118,214,255,.13) 36%, rgba(255,255,255,0) 68%),
        radial-gradient(circle at 36% 18%, rgba(255,111,174,.07), transparent 30%);
      pointer-events: none;
      z-index: -4;
    }

    .backpack-entrance::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0.25rem;
      width: min(74vw, 430px);
      height: 34px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,0,0,.36), rgba(0,0,0,0) 68%);
      filter: blur(9px);
      pointer-events: none;
      z-index: -2;
    }

    .enter-sign {
      position: relative;
      display: grid;
      justify-items: center;
      width: min(82vw, 320px);
      margin: 0 auto -0.72rem;
      transform: rotate(-3.5deg);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      z-index: 5;
    }

    .enter-sign::before,
    .enter-sign::after {
      content: "";
      position: absolute;
      top: -18px;
      width: 2px;
      height: 34px;
      background: linear-gradient(to bottom, rgba(246,200,95,0.18), rgba(190,230,255,0.82));
      box-shadow: 0 0 10px rgba(246,200,95,.16);
    }

    .enter-sign::before {
      left: 27%;
      transform: rotate(8deg);
    }

    .enter-sign::after {
      right: 27%;
      transform: rotate(-8deg);
    }

    .sign-board {
      position: relative;
      display: inline-grid;
      place-items: center;
      min-width: 190px;
      padding: 0.48rem 1.45rem 0.54rem;
      border: 2px solid rgba(246, 200, 95, 0.5);
      border-radius: 7px;
      background:
        linear-gradient(135deg, rgba(246,200,95,0.15), rgba(255,255,255,0.03) 42%, rgba(120,220,255,0.13)),
        linear-gradient(160deg, rgba(31,48,67,0.96), rgba(9,16,27,0.98));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 14px 32px rgba(0,0,0,.28),
        0 0 24px rgba(120,220,255,.14),
        0 0 18px rgba(246,200,95,.16);
      animation: enterFlash 1s steps(1, end) infinite;
    }

    .sign-board::before {
      content: "";
      position: absolute;
      top: -25px;
      left: calc(50% - 7px);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 32%, #fff7c4 0 2px, #f6c85f 3px 5px, #152333 6px);
      box-shadow: 0 0 14px rgba(246,200,95,.24);
    }

    .sign-word {
      color: #fff1a8;
      font-weight: 900;
      font-size: clamp(1.05rem, 4vw, 1.5rem);
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      text-shadow:
        0 0 16px rgba(143,232,255,0.42),
        0 0 18px rgba(246,200,95,0.36);
    }

    .sign-arrows {
      position: relative;
      width: 204px;
      height: 46px;
      margin-top: -4px;
      pointer-events: none;
    }

    .sign-arrow {
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 34px;
      border-radius: 999px;
      background: linear-gradient(to bottom, rgba(246,200,95,0.18), rgba(191,242,255,0.9));
      box-shadow: 0 0 14px rgba(246,200,95,.2);
      transform-origin: top center;
    }

    .sign-arrow::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -3px;
      width: 13px;
      height: 13px;
      border-right: 3px solid rgba(246,224,151,0.92);
      border-bottom: 3px solid rgba(191,242,255,0.9);
      transform: translateX(-50%) rotate(45deg);
    }

    .sign-arrow-left {
      transform: translateX(-68px) rotate(-22deg);
    }

    .sign-arrow-center {
      transform: translateX(-1px);
      height: 42px;
    }

    .sign-arrow-right {
      transform: translateX(66px) rotate(22deg);
    }

    .backpack-button {
      position: relative;
      display: grid;
      place-items: center;
      width: min(72vw, 410px);
      aspect-ratio: 446 / 496;
      margin-top: -6.2rem;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      isolation: isolate;
    }

    .backpack-button::before,
    .backpack-button::after {
      pointer-events: none;
    }

    .backpack-button::before {
      content: "";
      position: absolute;
      inset: 8% 2% 4%;
      border-radius: 46% 46% 42% 42%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,247,196,.62), rgba(116,222,255,.34) 32%, rgba(246,200,95,.2) 52%, rgba(120,220,255,0) 74%);
      filter: blur(30px);
      transform-origin: center;
      animation: backpackAura 4.1s ease-in-out infinite;
      z-index: -1;
    }

    .backpack-button::after {
      content: "";
      position: absolute;
      inset: -6% -8% 3%;
      border-radius: 44%;
      background:
        radial-gradient(circle at 42% 16%, rgba(246,200,95,.24), transparent 12%),
        radial-gradient(circle at 26% 20%, rgba(236,253,255,.42), transparent 9%),
        radial-gradient(circle at 68% 18%, rgba(153,226,255,.34), transparent 10%),
        radial-gradient(circle at 76% 60%, rgba(255,111,174,.18), transparent 13%),
        radial-gradient(circle at 32% 78%, rgba(150,230,255,.22), transparent 12%);
      filter: blur(13px);
      animation: magicalDrift 6.4s ease-in-out infinite;
      z-index: -2;
    }

    .backpack-image-crop {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transform-origin: 50% 58%;
      animation: backpackBreathe 5.2s ease-in-out infinite;
      filter:
        drop-shadow(0 24px 38px rgba(0,0,0,.36))
        drop-shadow(0 0 66px rgba(120,220,255,.62))
        drop-shadow(0 0 20px rgba(226,250,255,.7))
        drop-shadow(0 0 18px rgba(246,200,95,.22));
      pointer-events: none;
    }

    .backpack-image-crop img {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 229.6%;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: initial;
      image-orientation: none;
      animation: none;
      filter: none;
      transform: translate(-31.25%, -24.94%);
      pointer-events: none;
    }

    .backpack-gate.is-opening .backpack-image-crop {
      animation: backpackOpen 0.72s ease forwards;
    }

    .backpack-gate:not(.is-opening) .open-spark {
      opacity: 0.78;
      animation: idleSpark 3.4s ease-in-out infinite;
    }

    .backpack-gate:not(.is-opening) .spark-two {
      animation-delay: 0.8s;
    }

    .backpack-gate:not(.is-opening) .spark-three {
      animation-delay: 1.45s;
    }

    @keyframes enterFlash {
      0%, 49% {
        filter: brightness(1.45);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.22),
          0 16px 34px rgba(0,0,0,.3),
          0 0 32px rgba(120,220,255,.48),
          0 0 18px rgba(246,200,95,.5);
      }
      50%, 100% {
        filter: brightness(0.68);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.1),
          0 12px 28px rgba(0,0,0,.26),
          0 0 12px rgba(246,200,95,.16);
      }
    }

    @keyframes backpackBreathe {
      0%, 100% {
        transform: translateY(0) rotate(-0.25deg) scale(1);
      }
      50% {
        transform: translateY(-9px) rotate(0.2deg) scale(1.052);
      }
    }

    @keyframes backpackAura {
      0%, 100% {
        opacity: 0.54;
        transform: scale(0.9) rotate(-1deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.18) rotate(1deg);
      }
    }

    @keyframes magicalDrift {
      0%, 100% {
        opacity: 0.7;
        transform: translate3d(0,0,0) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate3d(0,-16px,0) scale(1.08);
      }
    }

    @keyframes idleSpark {
      0%, 100% {
        opacity: 0.18;
        transform: translate3d(0, 10px, 0) scale(0.72);
      }
      45% {
        opacity: 0.94;
        transform: translate3d(var(--spark-x), var(--spark-y), 0) scale(1.08);
      }
    }

    @media (max-width: 768px) {
      .home-backpack-section {
        min-height: 76vh;
      }

      .backpack-entrance {
        width: min(96vw, 500px);
        margin-top: 2rem;
      }

      .enter-sign {
        width: min(86vw, 292px);
        margin-bottom: -0.62rem;
      }

      .sign-arrows {
        width: 176px;
        height: 42px;
      }

      .sign-arrow {
        height: 32px;
      }

      .sign-arrow-center {
        height: 40px;
      }

      .sign-arrow-left {
        transform: translateX(-54px) rotate(-22deg);
      }

      .sign-arrow-right {
        transform: translateX(52px) rotate(22deg);
      }

      .backpack-button {
        width: min(76vw, 370px);
      }
    }

  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a class="brand-mark" href="index.html" aria-label="JoMagicBackpack home"><span>JoMagicBackpack</span></a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="categories.html">Backpack</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="reviews.html">Reviews</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a class="ebay-link" href="https://www.ebay.com/str/jomagicbackpack" target="_blank" rel="noopener noreferrer" aria-label="Visit eBay store">eBay</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="container hero-inner">
        <div class="hero-title" aria-label="JoMagicBackpack"><span class="hero-title-main">Jo'Magic Backpack</span></div>
        <p>Vintage, new, and unpredictable. If it sparks curiosity, it goes in the pack.</p>
      </div>
    </section>

    <section id="products" class="products-section home-backpack-section">
      <div class="container">
        <div id="backpackGate" class="backpack-gate">
          <p class="backpack-instruction">Tap the Pack to Reveal Its Contents!</p>
          <div class="backpack-entrance">
            <a class="enter-sign" href="categories.html" data-backpack-enter aria-label="Enter the backpack">
              <span class="sign-board"><span class="sign-word">ENTER</span></span>
              <span class="sign-arrows">
                <span class="sign-arrow sign-arrow-left"></span>
                <span class="sign-arrow sign-arrow-center"></span>
                <span class="sign-arrow sign-arrow-right"></span>
              </span>
            </a>
            <a id="openBackpack" class="backpack-button" href="categories.html" data-backpack-enter aria-label="Take a peek inside the backpack">
              <span class="open-spark spark-one" aria-hidden="true"></span>
              <span class="open-spark spark-two" aria-hidden="true"></span>
              <span class="open-spark spark-three" aria-hidden="true"></span>
              <span class="backpack-image-crop" aria-hidden="true">
                <img src="AF33BEB9-4375-48AE-B35A-07DF95F39F98.png" alt="">
              </span>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer><div class="container"><p>&copy; 2026 JoMagicBackpack. All rights reserved.</p></div></footer>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const enterSign = document.querySelector('.enter-sign[data-backpack-enter]');
      const backpackGate = document.getElementById('backpackGate');

      if (!enterSign || !backpackGate) return;

      enterSign.addEventListener('click', event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
        event.preventDefault();
        backpackGate.classList.add('is-opening');
        window.setTimeout(() => {
          window.location.href = enterSign.href;
        }, 720);
      });
    });
  </script>
  <script src="js/main.js?v=20260529d"></script>
</body>
</html>
