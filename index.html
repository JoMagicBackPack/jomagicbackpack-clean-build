<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoMagicBackpack - Unique Finds & Reseller Treasures</title>
  <meta name="description" content="JoMagicBackpack - vintage, new, and unpredictable finds from the backpack.">
  <link rel="icon" href="AF33BEB9-4375-48AE-B35A-07DF95F39F98.png">
  <link rel="stylesheet" href="css/styles.css?v=20260528e">
  <style>
    .backpack-instruction {
      font-size: clamp(1.18rem, 3.8vw, 1.62rem);
      margin-bottom: 0.65rem;
    }

    .backpack-button img {
      width: min(96vw, 598px);
      max-height: 621px;
    }

    .tap-pointer {
      position: absolute;
      top: 22%;
      right: -7%;
      width: 150px;
      height: 150px;
      transform: rotate(-18deg);
      transform-origin: 70% 70%;
      animation: tapNudge 2.4s ease-in-out infinite;
      pointer-events: none;
      z-index: 4;
    }

    .tap-finger {
      position: absolute;
      right: 45px;
      top: 8px;
      width: 28px;
      height: 96px;
      border: 2px solid rgba(218, 247, 255, 0.92);
      border-radius: 999px 999px 15px 15px;
      background: linear-gradient(160deg, rgba(235,248,255,0.95), rgba(142,220,255,0.18));
      box-shadow: 0 12px 28px rgba(0,0,0,.24), 0 0 20px rgba(120,220,255,.18);
      transform: rotate(34deg);
    }

    .tap-finger::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 7px;
      width: 12px;
      height: 10px;
      border-top: 2px solid rgba(8,18,27,0.34);
      border-radius: 50%;
    }

    .tap-finger::after {
      content: "";
      position: absolute;
      left: 5px;
      bottom: 17px;
      width: 16px;
      height: 2px;
      border-radius: 999px;
      background: rgba(8,18,27,0.24);
      box-shadow: 0 9px 0 rgba(8,18,27,0.18);
    }

    .tap-ring {
      position: absolute;
      right: 74px;
      top: 93px;
      width: 38px;
      height: 38px;
      border: 2px solid rgba(191, 242, 255, 0.78);
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(120,220,255,.26);
      animation: tapRipple 2.4s ease-out infinite;
    }

    @keyframes tapNudge {
      0%, 100% { transform: rotate(-18deg) translate3d(0, 0, 0); }
      48% { transform: rotate(-18deg) translate3d(-8px, 10px, 0); }
      62% { transform: rotate(-18deg) translate3d(-3px, 4px, 0); }
    }

    @keyframes tapRipple {
      0%, 38% { opacity: 0; transform: scale(0.55); }
      48% { opacity: 0.95; transform: scale(0.72); }
      100% { opacity: 0; transform: scale(1.7); }
    }

    @media (max-width: 768px) {
      .backpack-button img {
        width: min(98vw, 575px);
      }

      .tap-pointer {
        top: 20%;
        right: 2%;
        width: 112px;
        height: 112px;
      }

      .tap-finger {
        right: 32px;
        top: 5px;
        width: 22px;
        height: 76px;
      }

      .tap-ring {
        right: 52px;
        top: 72px;
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a class="brand-mark" href="index.html" aria-label="JoMagicBackpack home"><span>JoMagicBackpack</span></a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="categories.html">Backpack</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="reviews.html">Reviews</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a class="ebay-link" href="https://www.ebay.com/str/jomagicbackpack" target="_blank" rel="noopener noreferrer" aria-label="Visit eBay store"><img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay"></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="container hero-inner">
        <div class="hero-title" aria-label="JoMagicBackpack"><span class="hero-title-main">Jo'Magic Backpack</span></div>
        <p>Vintage, new, and unpredictable. If it sparks curiosity, it goes in the pack.</p>
      </div>
    </section>

    <section id="products" class="products-section home-backpack-section">
      <div class="container">
        <div id="backpackGate" class="backpack-gate">
          <p class="backpack-instruction">Tap the Pack to Reveal Its Contents!</p>
          <a id="openBackpack" class="backpack-button" href="categories.html" aria-label="Take a peek inside the backpack">
            <span class="tap-pointer" aria-hidden="true">
              <span class="tap-finger"></span>
              <span class="tap-ring"></span>
            </span>
            <span class="open-spark spark-one" aria-hidden="true"></span>
            <span class="open-spark spark-two" aria-hidden="true"></span>
            <span class="open-spark spark-three" aria-hidden="true"></span>
            <img src="AF33BEB9-4375-48AE-B35A-07DF95F39F98.png" alt="Open the JoMagicBackpack">
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer><div class="container"><p>&copy; 2026 JoMagicBackpack. All rights reserved.</p></div></footer>
  <script src="js/main.js?v=20260528e"></script>
</body>
</html>
